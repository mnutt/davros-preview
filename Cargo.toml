[package]
name = "davros-preview"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
office_oxide = { path = "vendor/office_oxide-0.1.13", default-features = false }
tempfile = "3"
docxide-pdf = { path = "vendor/docxide-pdf-0.17.1", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
libc = "0.2"
serde_json = "1"

lo_writer = { git = "https://github.com/mnutt/libreoffice-rs", rev = "16532b3f0ded4b2e05296d114e2eacd91827ed23", default-features = false }
lo_calc = { git = "https://github.com/mnutt/libreoffice-rs", rev = "16532b3f0ded4b2e05296d114e2eacd91827ed23", default-features = false }
lo_impress = { git = "https://github.com/mnutt/libreoffice-rs", rev = "16532b3f0ded4b2e05296d114e2eacd91827ed23", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
