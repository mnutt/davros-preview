name: Build, test and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # glibc 2.35 baseline, compatible with Davros's Debian 13 Sandstorm image.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fonts-liberation fonts-noto-core poppler-utils python3 python3-venv patch
          # prepare.py uses safe tar extraction; package-licenses.py uses tomllib.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-amd64-rust-1.98-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'patches/*', 'sources.json') }}
          restore-keys: |
            linux-amd64-rust-1.98-
      - name: Build
        run: ./build.sh
      - name: Test converters and sandbox
        run: ./test.sh
      - name: Package
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: davros-preview-linux-amd64
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: davros-preview-linux-amd64
          path: dist
      - name: Publish release archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
